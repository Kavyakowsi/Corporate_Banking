server.port=8080

spring.application.name=corporate-banking-demo

# ================================================================
# MySQL DATABASE
# ================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/corporate_banking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# ================================================================
# JPA / HIBERNATE
# ================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ================================================================
# SQL INITIALIZATION
# ================================================================
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# ================================================================
# LOGGING
# ================================================================
logging.level.com.example=INFO
logging.level.org.hibernate.SQL=DEBUG